services:
  postgres:
    image: postgres:16-alpine
    container_name: solo-postgres
    environment:
      POSTGRES_USER: solo
      POSTGRES_PASSWORD: solo
      POSTGRES_DB: solo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solo -d solo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
